<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签设置</title>
    <script type="module" src="/src/settings-window.ts" defer></script>
  </head>
  <body>
    <!-- 静态保底骨架：即使 JS 加载/渲染失败，窗口也不是一片白，且右上角 ✕ 可直接关闭窗口 -->
    <div class="settings-overlay settings-standalone" id="settings-skeleton">
      <div class="settings-modal settings-layout">
        <div class="settings-header">
          <span class="settings-title">设置</span>
          <button class="icon-btn close" id="skeleton-close" title="关闭">&#10005;</button>
        </div>
        <div class="settings-body settings-layout-body">
          <div class="settings-content"><p class="settings-tip">加载中…</p></div>
        </div>
      </div>
    </div>
  </body>
</html>
