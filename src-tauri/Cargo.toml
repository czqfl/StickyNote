[package]
name = "sticky-note-tauri"
version = "1.0.0"
description = "A Tauri Sticky Note App"
authors = ["you"]
edition = "2021"

# 关键：release 必须启用 custom-protocol，否则 generate_context! 会把构建当作 dev 模式，
# 不嵌入前端资源（指向 devUrl），导致发布版 webview 加载失败（空白/错误页）。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
arboard = "3"
# 透明主题原生亚克力：SetWindowCompositionAttribute（未文档化 API，运行时 GetProcAddress）
# + Win11 原生圆角（DwmSetWindowAttribute DWMWA_WINDOW_CORNER_PREFERENCE）
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
